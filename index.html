<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Our Network - Responsive Preview</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />

    <style>
      :root {
        --blue: #1958f4;
        --cyan: #17dddb;
        --ink: #071226;
        --muted: #42526b;
        --soft-border: rgba(25, 88, 244, 0.14);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        min-height: 100%;
        margin: 0;
        overflow-x: hidden;
        font-family:
          "Inter",
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        color: var(--ink);
        background:
          radial-gradient(
            circle at 75% 10%,
            rgba(25, 88, 244, 0.32),
            transparent 38%
          ),
          radial-gradient(
            circle at 70% 42%,
            rgba(23, 221, 219, 0.22),
            transparent 36%
          ),
          linear-gradient(135deg, #fafdff 0%, #eafaff 42%, #eef4ff 100%);
      }

      .network-section {
        position: relative;
        min-height: 100vh;
        display: flex;
        align-items: center;
        padding: clamp(48px, 7vw, 96px) 0;
        overflow: hidden;
      }

      .network-section::before,
      .network-section::after {
        content: "";
        position: absolute;
        border: 1px solid rgba(255, 255, 255, 0.45);
        border-radius: 50%;
        pointer-events: none;
      }

      .network-section::before {
        width: 520px;
        height: 520px;
        right: -160px;
        top: -240px;
      }

      .network-section::after {
        width: 760px;
        height: 760px;
        right: -300px;
        top: -360px;
        opacity: 0.65;
      }

      .network-content {
        position: relative;
        z-index: 2;
      }

      .eyebrow {
        display: inline-block;
        margin-bottom: 14px;
        font-size: clamp(0.74rem, 0.9vw, 0.88rem);
        font-weight: 800;
        line-height: 1;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--blue);
      }

      .network-title {
        margin: 0 0 18px;
        font-size: clamp(4.1rem, 8vw, 7.2rem);
        line-height: 0.86;
        font-weight: 600;
        letter-spacing: -0.075em;
      }

      .network-title span {
        display: block;
        background: linear-gradient(90deg, var(--blue), var(--cyan));
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }

      .network-copy {
        max-width: 520px;
        margin: 0;
        color: #20314c;
        font-size: clamp(1rem, 1.1vw, 1.08rem);
        line-height: 1.62;
      }

      .ux-card {
        max-width: 460px;
        margin-top: 28px;
        padding: 20px 22px;
        border: 1px solid var(--soft-border);
        border-radius: 20px;
        background: rgba(255, 255, 255, 0.66);
        box-shadow: 0 24px 60px rgba(27, 61, 122, 0.08);
        backdrop-filter: blur(10px);
      }

      .ux-card strong {
        display: block;
        margin-bottom: 9px;
        font-size: 0.98rem;
        font-weight: 900;
      }

      .ux-card p {
        margin: 0;
        color: var(--muted);
        line-height: 1.55;
        font-size: 0.96rem;
      }

      .map-shell {
        position: relative;
        width: min(100%, 920px);
        margin-inline: auto;
        padding: 8px 0 0;
      }

      .map-stage {
        position: relative;
        width: 100%;
        aspect-ratio: 1860.7 / 1986.9;
        overflow: visible;
      }

      .latam-map {
        width: 100%;
        height: 100%;
        display: block;
        object-fit: contain;
        pointer-events: none;
        filter: drop-shadow(0 18px 36px rgba(25, 88, 244, 0.06));
        user-select: none;
      }

      /*
      Country labels are placed independently from the pins.
      Use --x / --y to move each label away from markers.
      The labels keep a minimum readable size on mobile.
    */
      .country-label {
        position: absolute;
        z-index: 4;
        left: var(--x);
        top: var(--y);
        transform: translate(-50%, -50%);
        min-width: max-content;
        color: #334766;
        font-size: clamp(13px, 1.35vw, 19px);
        line-height: 1;
        font-weight: 900;
        letter-spacing: -0.045em;
        text-shadow: none;
        pointer-events: none;
        white-space: nowrap;
      }

      .country-label.label-small {
        font-size: clamp(12px, 1.05vw, 16px);
      }

      .country-label.label-left {
        transform: translate(-100%, -50%);
      }

      .country-label.label-right {
        transform: translate(0, -50%);
      }

      .country-label.label-top {
        transform: translate(-50%, -100%);
      }

      .country-label.label-bottom {
        transform: translate(-50%, 0);
      }

      .network-pin {
        position: absolute;
        z-index: 6;
        left: var(--x);
        top: var(--y);
        width: clamp(12px, 1.3vw, 18px);
        height: clamp(12px, 1.3vw, 18px);
        border: 1.5px solid #fff;
        border-radius: 999px;
        background: var(--cyan);
        box-shadow: 0 4px 12px rgba(25, 88, 244, 0.16);
        transform: translate(-50%, -50%);
        cursor: pointer;
        appearance: none;
        padding: 0;
        transition:
          transform 0.18s ease,
          background 0.18s ease,
          box-shadow 0.18s ease;
      }

      .network-pin:hover,
      .network-pin:focus-visible,
      .network-pin.active {
        background: var(--blue);
        transform: translate(-50%, -50%) scale(1.22);
        box-shadow: 0 7px 18px rgba(25, 88, 244, 0.3);
        outline: none;
      }

      .network-pin.coming-soon {
        background: #aeb8c4;
      }

      .network-pin.coming-soon:hover,
      .network-pin.coming-soon:focus-visible,
      .network-pin.coming-soon.active {
        background: #6f7d8d;
      }

      .map-legend {
        display: flex;
        align-items: center;
        justify-content: left;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 16px;
      }

      .legend-pill {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 9px 14px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.72);
        box-shadow: 0 16px 38px rgba(30, 51, 94, 0.08);
        font-size: 0.92rem;
        font-weight: 800;
        color: #26334a;
      }

      .legend-dot {
        width: 12px;
        height: 12px;
        border: 1.5px solid #fff;
        border-radius: 999px;
        background: var(--cyan);
      }

      .legend-dot.soon {
        background: #aeb8c4;
      }

      .network-tooltip {
        position: absolute;
        z-index: 30;
        left: 50%;
        top: 50%;
        min-width: 220px;
        max-width: min(300px, calc(100vw - 32px));
        padding: 13px 15px;
        border-radius: 12px;
        background: #050b18;
        color: #fff;
        box-shadow: 0 18px 44px rgba(5, 11, 24, 0.26);
        transform: translate(-50%, calc(-100% - 18px));
        font-size: 0.91rem;
        line-height: 1.35;
      }

      .network-tooltip::after {
        content: "";
        position: absolute;
        left: 50%;
        bottom: -8px;
        transform: translateX(-50%);
        border-width: 8px 7px 0;
        border-style: solid;
        border-color: #050b18 transparent transparent;
      }

      .network-tooltip strong {
        display: block;
        margin-bottom: 3px;
        font-weight: 900;
        font-size: 0.98rem;
      }

      .network-tooltip small {
        display: block;
        margin-bottom: 8px;
        color: rgba(255, 255, 255, 0.68);
        font-weight: 700;
      }

      .network-tooltip a {
        color: var(--cyan);
        font-weight: 900;
        text-decoration: none;
      }

      .network-tooltip a:hover {
        text-decoration: underline;
      }

      .network-tooltip .soon-text {
        display: inline-flex;
        align-items: center;
        padding: 5px 9px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.1);
        font-weight: 900;
      }

      @media (max-width: 991.98px) {
        .network-section {
          align-items: flex-start;
          padding-top: 46px;
        }

        .network-title {
          font-size: clamp(3.4rem, 15vw, 5.8rem);
        }

        .network-copy,
        .ux-card {
          max-width: none;
        }

        .map-shell {
          width: min(100%, 740px);
          margin-top: 28px;
        }
      }

      @media (max-width: 575.98px) {
        .network-section {
          padding-block: 34px;
        }

        .ux-card {
          padding: 16px;
          border-radius: 18px;
        }

        .map-shell {
          width: min(100%, 600px);
        }

        .country-label {
          font-size: clamp(12px, 3.2vw, 15px);
          text-shadow: none;
        }

        .country-label.label-small {
          font-size: clamp(10px, 2.7vw, 13px);
        }

        .network-pin {
          width: 13px;
          height: 13px;
          border-width: 1.5px;
        }

        .map-legend {
          gap: 8px;
          margin-top: 12px;
        }

        .legend-pill {
          padding: 8px 11px;
          font-size: 0.82rem;
        }

        .network-tooltip {
          position: fixed;
          left: 50% !important;
          top: auto !important;
          bottom: 18px;
          transform: translateX(-50%);
          width: calc(100% - 32px);
          max-width: 380px;
        }

        .network-tooltip::after {
          display: none;
        }
      }
    </style>
  </head>

    <script>
      document.addEventListener("DOMContentLoaded", function () {
        const stage = document.getElementById("mapStage");
        const tooltip = document.getElementById("networkTooltip");
        const pins = Array.from(document.querySelectorAll(".network-pin"));

        if (!stage || !tooltip || !pins.length) return;

        function closeTooltip() {
          tooltip.hidden = true;
          tooltip.innerHTML = "";
          pins.forEach((pin) => pin.classList.remove("active"));
        }

        function positionTooltip(pin) {
          const stageBox = stage.getBoundingClientRect();
          const pinBox = pin.getBoundingClientRect();

          tooltip.style.left =
            pinBox.left - stageBox.left + pinBox.width / 2 + "px";
          tooltip.style.top = pinBox.top - stageBox.top + "px";
        }

        function openTooltip(pin, event) {
          if (event) event.stopPropagation();

          pins.forEach((item) => item.classList.remove("active"));
          pin.classList.add("active");

          const name = pin.dataset.name || "";
          const country = pin.dataset.country || "";
          const url = pin.dataset.url || "";
          const status = pin.dataset.status || "";

          if (status === "Coming Soon") {
            tooltip.innerHTML =
              "<strong>" +
              name +
              "</strong>" +
              "<small>" +
              country +
              "</small>" +
              "<span class='soon-text'>Coming Soon</span>";
          } else {
            tooltip.innerHTML =
              "<strong>" +
              name +
              "</strong>" +
              "<small>" +
              country +
              "</small>" +
              "<a href='" +
              url +
              "' target='_blank' rel='noopener'>Visit website</a>";
          }

          positionTooltip(pin);
          tooltip.hidden = false;
        }

        pins.forEach((pin) => {
          pin.addEventListener("click", (event) => openTooltip(pin, event));

          pin.addEventListener("keydown", (event) => {
            if (event.key === "Enter" || event.key === " ") {
              event.preventDefault();
              openTooltip(pin, event);
            }

            if (event.key === "Escape") {
              closeTooltip();
            }
          });
        });

        tooltip.addEventListener("click", (event) => event.stopPropagation());
        document.addEventListener("click", closeTooltip);

        window.addEventListener("resize", () => {
          const activePin = document.querySelector(".network-pin.active");
          if (activePin && !tooltip.hidden) {
            positionTooltip(activePin);
          }
        });
      });
    </script>
  </body>
</html>
